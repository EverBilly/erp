# =============================================================================
# Server
# =============================================================================
server.port=${PORT:8080}

# =============================================================================
# Database (PostgreSQL)
# =============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pos_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Initialize DB with schema script
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql
spring.sql.init.data-locations=classpath:sql/schema.sql

# =============================================================================
# JPA / Hibernate
# =============================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JSONB support
spring.jpa.properties.hibernate.types.jackson.objectmapper=com.fasterxml.jackson.databind.ObjectMapper
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =============================================================================
# JWT
# =============================================================================
jwt.secret=${JWT_SECRET:cambia_esto_por_una_clave_segura_de_al_menos_64_caracteres_1234567890abcdef}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# =============================================================================
# Logging (development)
# =============================================================================
logging.level.com.pos=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate=WARN

# =============================================================================
# Error handling
# =============================================================================
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true

# =============================================================================
# Actuator
# =============================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =============================================================================
# CORS
# =============================================================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001
