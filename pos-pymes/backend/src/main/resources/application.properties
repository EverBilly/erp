# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/pos_db
spring.datasource.username=pos_user
spring.datasource.password=pos_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.show-sql=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

#JSONB
spring.jpa.properties.hibernate.types.jackson.objectmapper=com.fasterxml.jackson.databind.ObjectMapper
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Configuration - Clave DEBE tener al menos 64 caracteres para HS512
jwt.secret=MySuperSecureKeyForPOSApplicationThatIsAtLeast64CharactersLongForHS512Algorithm2024!
jwt.expiration=86400000

# Logging detallado para debugging
logging.level.com.pos=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Mostrar errores de autenticación
logging.level.org.springframework.security.web.authentication=TRACE

# Mostrar stack traces completas de errores
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true

# Security
security.max-login-attempts=5
security.lock-time-minutes=15
security.session-timeout-minutes=120

# Logging detallado para Spring Security
logging.level.org.springframework.security=TRACE
logging.level.com.pos=DEBUG
logging.level.org.hibernate=ERROR

# Mostrar excepciones completas
logging.level.com.pos=DEBUG
logging.level.org.springframework.web=DEBUG

# Show errors
server.error.include-stacktrace=always
server.error.include-message=always

management.endpoints.web.exposure.include=health,info,mappings,beans
management.endpoint.health.show-details=always
management.endpoint.mappings.enabled=true
management.endpoint.beans.enabled=true